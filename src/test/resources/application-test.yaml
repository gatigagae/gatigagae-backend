spring:
  datasource:
    url: jdbc:tc:postgresql:17:///gatigagae
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 100
    show-sql: false
    open-in-view: false

  cloud:
    aws:
      credentials:
        access-key: test
        secret-key: test
      region:
        static: ap-northeast-2

app:
  profile-page-url: http://localhost:8080/profile
  s3:
    bucket: test-bucket

tour-api:
  service-key: test-service-key

swagger:
  server-url: http://localhost:8080
  server-description: Test Server