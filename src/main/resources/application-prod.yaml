spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 100
    show-sql: false
    open-in-view: false

  http:
    clients:
      connect-timeout: 2s
      read-timeout: 3s

  cloud:
    aws:
      region:
        static: ${S3_REGION}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

app:
  profile-page-url: ${SERVER_URL}/profile
  s3:
    bucket: ${S3_BUCKET}

swagger:
  server-url: ${SERVER_URL}
  server-description: Production Server